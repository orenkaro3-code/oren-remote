<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>אורן למועצה · מצגת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="deck.css?v=3">
<style>
[hidden] { display: none !important; }
:root { color-scheme: dark; --paper: #F4EFE6; --ink: #161616; --yellow: #FFD400; --red: #FF4B2B; --blue: #2F6BFF; --green: #7EE081; --soft: #A9A397; }
html, body { margin: 0; height: 100%; background: #000; color: var(--paper); font-family: "Rubik", Arial, sans-serif; overflow: hidden; }
button { font-family: inherit; }
#stage { position: fixed; inset: 0 0 64px 0; }
body.full #stage { inset: 0; }

/* control bar */
.bar { position: fixed; inset-inline: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--ink); border-top: 3px solid var(--yellow); transition: transform .3s; }
body.full .bar { transform: translateY(100%); }
body.full.show-bar .bar { transform: none; }
.bar button { min-height: 44px; padding: 0 1rem; border: 2px solid var(--paper); background: transparent; color: var(--paper); font-weight: 700; font-size: 1rem; cursor: pointer; }
.bar button.y { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
.bar .nav { font-size: 1.4rem; width: 52px; padding: 0; }
.count { font-family: "Karantina", "Arial Narrow", sans-serif; font-size: 2rem; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.phone-state { display: flex; align-items: center; gap: .5rem; color: var(--soft); font-size: .95rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); }
.dot.on { background: var(--green); }

.unmute { position: fixed; z-index: 20; top: 18px; left: 50%; transform: translateX(-50%); min-height: 52px; padding: 0 1.4rem; border: 3px solid var(--ink); background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 4px 4px 0 var(--red); }

/* pair overlay */
.pair { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(22,22,22,.96); padding: 24px; overflow: auto; }
.pair-card { display: grid; grid-template-columns: auto 1fr; gap: clamp(24px, 5vw, 56px); align-items: center; max-width: 960px; }
.pair h1 { font-family: "Karantina", "Arial Narrow", sans-serif; font-size: clamp(3rem, 7vw, 5.4rem); line-height: .9; margin: 0 0 1rem; }
.pair h1 span { background: var(--yellow); color: var(--ink); padding: 0 .2em; }
.pair ol { margin: 0 0 1rem; padding-inline-start: 1.3rem; font-size: 1.1rem; line-height: 1.8; color: #DDD6C8; }
.code { font-weight: 900; font-size: clamp(3rem, 8vw, 5.4rem); letter-spacing: .12em; color: var(--yellow); direction: ltr; unicode-bidi: isolate; text-align: start; font-variant-numeric: tabular-nums; }
.url { color: var(--paper); font-weight: 700; direction: ltr; unicode-bidi: isolate; }
#qr { background: var(--paper); padding: 16px; width: 252px; height: 252px; }
#qr img, #qr canvas { display: block; width: 220px; height: 220px; }
.status { color: var(--soft); min-height: 1.5em; margin: .6rem 0 1rem; }
.status.ok { color: var(--green); }
.status.bad { color: #FF8A73; }
.pbtn { min-height: 52px; padding: 0 1.4rem; border: 3px solid var(--paper); background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 4px 4px 0 var(--red); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (max-width: 760px) {
  .pair-card { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .bar .label { display: none; }
}
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>

<button class="unmute" id="unmute" type="button" hidden>🔊 לחצו להפעלת הסאונד</button>

<div class="bar" id="bar">
  <button class="nav" id="prevBtn" type="button" aria-label="השקף הקודם">›</button>
  <span class="count" id="count">1/9</span>
  <button class="nav" id="nextBtn" type="button" aria-label="השקף הבא">‹</button>
  <span class="grow"></span>
  <span class="phone-state"><span class="dot" id="dot"></span><span class="label" id="phoneLabel">טלפון לא מחובר</span></span>
  <button type="button" id="pairBtn">חיבור טלפון</button>
  <button class="y" type="button" id="fullBtn">מסך מלא</button>
</div>

<div class="pair" id="pair">
  <div class="pair-card">
    <div id="qr" aria-label="קוד QR לחיבור הטלפון"></div>
    <div>
      <h1>מחברים <span>את הטלפון</span></h1>
      <ol>
        <li>סורקים את הקוד בטלפון, או נכנסים ל־<span class="url" id="remoteUrl"></span></li>
        <li>מקלידים את הקוד:</li>
      </ol>
      <div class="code" id="code">······</div>
      <p class="status" id="status" role="status">מכין את החיבור...</p>
      <button class="pbtn" type="button" id="closePair">חזרה למצגת</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="slides.js?v=3"></script>
<script src="shared.js?v=3"></script>
<script>
(function () {
  var N = Deck.count(), cur = 0, mounted, code, interacted = false, broadcast = function () {};
  var stage = document.getElementById('stage');

  /* ---------- slides ---------- */
  function show(i, fromPhone) {
    i = Math.max(0, Math.min(N - 1, i));
    var old = stage.querySelector('video'); if (old) old.pause();
    cur = i; mounted = Deck.mount(stage, i);
    document.getElementById('count').textContent = (i + 1) + '/' + N;
    document.getElementById('prevBtn').disabled = i === 0;
    document.getElementById('nextBtn').disabled = i === N - 1;
    var v = stage.querySelector('video');
    document.getElementById('unmute').hidden = true;
    if (v) { v.controls = true; v.currentTime = 0; playSafe(v); }
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    broadcast();
  }
  // Play with sound if the browser allows it; otherwise play muted and offer a one-click unmute.
  function playSafe(v) {
    v.muted = false;
    v.play().catch(function () {
      v.muted = true;
      v.play().catch(function () {});
      document.getElementById('unmute').hidden = false;
    });
  }
  function video(action) {
    var v = stage.querySelector('video'); if (!v) return;
    if (action === 'restart') { v.currentTime = 0; playSafe(v); }
    else if (action === 'play') playSafe(v);
    else if (action === 'pause') v.pause();
  }
  document.getElementById('unmute').addEventListener('click', function () {
    interacted = true; this.hidden = true;
    var v = stage.querySelector('video'); if (v) { v.muted = false; v.play().catch(function () {}); }
  });
  var start = parseInt((location.hash || '').slice(1), 10);
  show(isNaN(start) ? 0 : start - 1);

  function step(d) { interacted = true; show(cur + d); }
  document.getElementById('nextBtn').addEventListener('click', function () { step(1); });
  document.getElementById('prevBtn').addEventListener('click', function () { step(-1); });
  addEventListener('keydown', function (e) {
    if (!document.getElementById('pair').hidden) { if (e.key === 'Escape') closePair(); return; }
    if (['ArrowLeft', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); step(1); }
    else if (['ArrowRight', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); step(-1); }
  });
  // swipe on touch screens: swipe left = next (Hebrew reading direction)
  var sx = null;
  stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1); });
  addEventListener('resize', function () { if (mounted) mounted.fit(); });
  addEventListener('pointerdown', function () { interacted = true; }, { once: true });

  /* ---------- fullscreen ---------- */
  var hideT;
  document.getElementById('fullBtn').addEventListener('click', function () {
    interacted = true;
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
  });
  document.addEventListener('fullscreenchange', function () {
    document.body.classList.toggle('full', !!document.fullscreenElement);
    document.getElementById('fullBtn').textContent = document.fullscreenElement ? 'יציאה ממסך מלא' : 'מסך מלא';
    setTimeout(function () { if (mounted) mounted.fit(); }, 60);
  });
  addEventListener('mousemove', function (e) {
    if (!document.body.classList.contains('full')) return;
    if (e.clientY > innerHeight - 90) { document.body.classList.add('show-bar'); clearTimeout(hideT); hideT = setTimeout(function () { document.body.classList.remove('show-bar'); }, 2500); }
  });

  /* ---------- phone link (internet relay, any network) ---------- */
  var statusEl = document.getElementById('status'), phoneSeen = 0, es = null;
  function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }
  function setPhone(on) {
    document.getElementById('dot').classList.toggle('on', on);
    document.getElementById('phoneLabel').textContent = on ? 'טלפון מחובר' : 'טלפון לא מחובר';
  }
  setInterval(function () { setPhone(Date.now() - phoneSeen < 45000); }, 3000);
  broadcast = function () { if (code) Deck.send(code, 'down', { type: 'state', slide: cur }).catch(function () {}); };

  try { code = sessionStorage.getItem('oren-code'); } catch (e) {}
  if (!/^\d{6}$/.test(code || '')) { code = Deck.newCode(); try { sessionStorage.setItem('oren-code', code); } catch (e) {} }
  document.getElementById('code').textContent = code;
  var link = new URL('remote.html', location.href).href.split('?')[0] + '?code=' + code;
  if (window.QRCode) new QRCode(document.getElementById('qr'), { text: link, width: 220, height: 220, colorDark: '#161616', colorLight: '#F4EFE6' });
  setStatus('מכין את החיבור...');
  es = Deck.listen(code, 'up', function (m) {
    phoneSeen = Date.now(); setPhone(true); interacted = true;
    if (m.type === 'hello') {
      Deck.send(code, 'down', { type: 'state', slide: cur, hello: m.id }).catch(function () {});
      setStatus('הטלפון מחובר! אפשר לחזור למצגת.', 'ok');
      setTimeout(closePair, 1200);
    } else if (m.type === 'go' && typeof m.slide === 'number') {
      // the phone already shows this slide, so no echo back (saves relay requests)
      var keep = broadcast; broadcast = function () {}; show(m.slide); broadcast = keep;
    } else if (m.type === 'video') video(m.action);
    else if (m.type === 'ping') {}
  }, function (st) {
    if (st === 'open') setStatus(phoneSeen ? 'הטלפון מחובר! אפשר לחזור למצגת.' : 'מוכן. סרקו את הקוד מהטלפון.', phoneSeen ? 'ok' : '');
    else setStatus('אין חיבור לאינטרנט. מנסה שוב...', 'bad');
  });
  document.getElementById('remoteUrl').textContent = location.host + '/remote.html';

  function openPair() { document.getElementById('pair').hidden = false; }
  function closePair() { document.getElementById('pair').hidden = true; }
  document.getElementById('pairBtn').addEventListener('click', openPair);
  document.getElementById('closePair').addEventListener('click', closePair);
})();
</script>
</body>
</html>
